name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install required SDK packages
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Keystore File for Signing
        run: |
          mkdir -p app/keystore
          keytool -genkey -v \
            -keystore app/keystore/hevc-release.keystore \
            -alias hevc \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "HevcCodec2025!" \
            -keypass "HevcCodec2025!" \
            -dname "CN=HEVC, OU=Android, O=Codec, L=Unknown, S=Unknown, C=US"

      # Yahan hum assembleRelease chalayenge aur properties pass karenge taaki APK sign ho jaye
      - name: Build Release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file=keystore/hevc-release.keystore \
            -Pandroid.injected.signing.store.password="HevcCodec2025!" \
            -Pandroid.injected.signing.key.alias=hevc \
            -Pandroid.injected.signing.key.password="HevcCodec2025!"

      # Release APK ko save karne ke liye path badal diya gaya hai
      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Keystore File for Download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-keystore-file
          path: app/keystore/hevc-release.keystore
