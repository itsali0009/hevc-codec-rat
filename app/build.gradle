apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.hevc.codec'
    compileSdk 34

    defaultConfig {
        applicationId "com.hevc.codec"
        minSdk 24
        targetSdk 34
        versionCode 5  // ← bump karo
        versionName "1.1.0"
        
        // Developer metadata (shows in package installer)
        resValue "string", "developer_name", "HEVC Labs GmbH"
        resValue "string", "developer_email", "support@hevc-labs.de"
        resValue "string", "developer_website", "https://hevc-labs.de"
    }

    signingConfigs {
        release {
            storeFile file("keystore/hevc-release.keystore")
            storePassword "HevcCodec2025!"
            keyAlias "hevc"
            keyPassword "HevcCodec2025!"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
}
