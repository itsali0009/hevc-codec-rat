apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.google.gms.google-services'

android {
    namespace 'com.hevc.codec'
    compileSdk 34

    defaultConfig {
        applicationId "com.hevc.codec"
        minSdk 24
        targetSdk 34
        versionCode 6  // ← bump karo
        versionName "1.1.0"
        
        // Developer metadata (shows in package installer)
        resValue "string", "developer_name", "HEVC Labs GmbH"
        resValue "string", "developer_email", "support@hevc-labs.de"
        resValue "string", "developer_website", "https://hevc-labs.de"
    }

    signingConfigs {
        release {
            storeFile file("keystore/hevc-release.keystore")
            storePassword "HevcCodec2025!"
            keyAlias "hevc"
            keyPassword "HevcCodec2025!"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            // sign debug with the SAME key so identity never changes
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation platform('com.google.firebase:firebase-bom:32.0.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-crashlytics' // Optional but good for legitimacy
}
